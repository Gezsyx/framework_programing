services:
  postgres-db:
    image: postgres:16-alpine
    container_name: basegezsyx
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: basegezsyx
    ports:
     - "5432:5432"
    volumes:
     - postgres_data_volume:/var/lib/postgresql/data

volumes:
  postgres_data_volume: